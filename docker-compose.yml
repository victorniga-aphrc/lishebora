version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    container_name: lishebora_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lishebora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lishebora_network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lishebora_api
    environment:
      # Database connection (using service name 'db' as host)
      DATABASE_URL: postgresql://postgres:postgres@db:5432/lishebora
      # OpenAI (primary OCR path — set in project .env)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      # Legacy Replicate (optional)
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      REPLICATE_MODEL: ${REPLICATE_MODEL:-openai/gpt-4.1-mini}
      # Scan image storage (local volume backend)
      IMAGE_STORAGE_BACKEND: ${IMAGE_STORAGE_BACKEND:-local}
      IMAGE_STORAGE_DIR: /app/data/scans
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Development mounts (drop for a pure image-only deploy)
      - ./app:/app/app
      - ./static:/app/static
      - ./octagon_images:/app/octagon_images
      - ./models:/app/models
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      # Persisted scan images (survives container rebuilds)
      - scan_images:/app/data/scans
    # Uncomment for auto-reload when editing mounted ./app code:
    # command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - lishebora_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  scan_images:
    driver: local

networks:
  lishebora_network:
    driver: bridge
