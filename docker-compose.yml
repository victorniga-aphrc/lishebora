version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    container_name: lishebora_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lishebora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lishebora_network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lishebora_api
    environment:
      # Database connection (using service name 'db' as host)
      DATABASE_URL: postgresql://postgres:postgres@db:5432/lishebora
      # Replicate API (should be set in .env or passed via environment)
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      REPLICATE_MODEL: ${REPLICATE_MODEL:-openai/gpt-4.1-mini}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount code for development (optional - remove for production)
      - ./app:/app/app
      # Mount alembic for migrations
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    networks:
      - lishebora_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  lishebora_network:
    driver: bridge
